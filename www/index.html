<style>
:root{--bg:#0a0c0f;--p1:#101317;--p2:#161a20;--p3:#1f242c;--p4:#2a3039;--ln:#232931;--tx:#eef1f5;--mu:#8b95a3;--mu2:#5c6674;--ac:#4a90ff;--foc:#e8ecf1;--gold:#f5c518;--red:#ff4d4d;--ok:#3ccf7a;--CHW:280px;--rail:68px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:Tajawal,system-ui,-apple-system,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--ac)}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#2c333d;border-radius:8px}::-webkit-scrollbar-track{background:transparent}
.spin{width:40px;height:40px;border:3px solid #ffffff2a;border-top-color:var(--ac);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto}
.spin.sm{width:16px;height:16px;border-width:2px;display:inline-block;vertical-align:middle;margin:0 6px}
@keyframes sp{to{transform:rotate(360deg)}}
.lg{background:#07090b;border-radius:7px;display:grid;place-items:center;overflow:hidden;color:var(--mu);font-weight:800;font-size:13px;flex-shrink:0}
.lg img{max-width:88%;max-height:84%;object-fit:contain}
.tag{font-size:12px;padding:2px 10px;border-radius:20px;background:var(--p3);color:#cfd6df;white-space:nowrap}
.tag.live{background:#3a1416;color:#ff8f8f}.tag.arc{background:#13314f;color:#9cc8ff}.tag.q{background:#3b2a05;color:var(--gold);font-weight:800}
.bar{height:3px;background:#ffffff1f;border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.hint{color:var(--mu);font-size:13px;line-height:1.8;margin-top:10px}.hint.big{font-size:16px;text-align:center;margin-top:60px}
.dot{color:var(--mu2)}
.credit{color:var(--mu2);font-size:12.5px;margin-top:22px;line-height:1.8}
.pc .ab{position:absolute;top:7px;right:7px;display:flex;gap:3px}
.pc .ab i{font-style:normal;font-size:10.5px;font-weight:800;padding:1px 5px;border-radius:5px;background:#0d3b2ae6;color:#7ff0b0}
.pc .ab i.au{background:#2a1f4de6;color:#c9b3ff}
.trk{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:14px;color:var(--mu)}
.trk b{color:#dfe5ec;font-weight:500}.trk .ok{color:var(--ok)}
.dl{display:flex;gap:14px;align-items:center;background:var(--p2);border:1px solid var(--ln);border-radius:14px;padding:12px 16px;margin-top:10px}
.dl .im{width:46px;height:68px;border-radius:8px;background:#141820 center/cover no-repeat;flex-shrink:0}
.dl .f{flex:1;min-width:0}.dl b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dl small{display:block;color:var(--mu);font-size:12.5px;margin-top:3px}
.dl .bar{height:5px;margin-top:8px}.dl .bar i{transition:width .4s}
.dl.done .bar i{background:var(--ok)}.dl.err .bar i{background:var(--red)}
.pinbox{display:flex;gap:10px;justify-content:center;margin:18px 0}
.pinbox input{width:220px;text-align:center;font-size:30px;letter-spacing:12px;background:var(--bg);border:1px solid var(--ln);border-radius:12px;padding:10px;outline:0;direction:ltr}
.pinbox input:focus{border-color:var(--ac)}
.ep .dlb{margin-inline-start:auto;align-self:center;flex-shrink:0;width:34px;height:34px;border-radius:50%;background:#ffffff14;display:grid;place-items:center;font-size:15px}
.ep .dlb:hover{background:#ffffff30}
/* rail */
#rail{position:fixed;top:0;bottom:0;inset-inline-start:0;width:var(--rail);background:#06080a;z-index:30;display:flex;flex-direction:column;padding:14px 10px;gap:4px;transition:width .18s,box-shadow .18s;overflow:hidden;border-inline-end:1px solid #14181d}
#rail:hover{width:224px;box-shadow:-30px 0 60px #000c}
[dir=ltr] #rail:hover{box-shadow:30px 0 60px #000c}
#rail .brand{display:flex;align-items:center;gap:12px;height:48px;margin-bottom:16px}
#rail .brand .bmark{width:40px;height:auto;flex-shrink:0;margin:0 3px}
#rail .brand b{font-size:17px;white-space:nowrap}
#rail .ri{display:flex;align-items:center;gap:15px;height:48px;border-radius:12px;padding:0 13px;color:var(--mu);white-space:nowrap;width:100%;font-size:15px;font-weight:500}
#rail .ri svg{width:22px;height:22px;flex-shrink:0}
#rail .ri:hover{background:var(--p3);color:var(--tx)}
#rail .ri.on{background:var(--foc);color:#0a0c0f}
#rail .sp{flex:1}
#rail .ri span,#rail .brand b{opacity:0;transition:opacity .15s}
#rail:hover .ri span,#rail:hover .brand b{opacity:1}
body.pm #rail{display:none}
#screen{position:fixed;top:0;bottom:0;inset-inline-start:var(--rail);inset-inline-end:0;overflow:hidden}
/* lists */
.li{display:flex;align-items:center;gap:10px;width:100%;text-align:start;padding:11px 14px;border-radius:10px;font-size:15px;color:#d5dbe3;cursor:pointer}
.li span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li:hover{background:var(--p3)}
.li.foc{background:var(--foc);color:#0a0c0f}
.mob .li .ga,.mob .pc .rmx{display:inline-grid!important}
.mob .vhero{height:34vh;min-height:0}.mob .dpost{width:118px;border-radius:10px}.mob .dtop{margin-top:10px;gap:18px;flex-direction:row!important;align-items:flex-start!important}.mob .dc{padding:12px 20px 40px}.mob .dm h1{font-size:24px}.mob .plot{font-size:14px;line-height:1.7}.mob .dbg,.mob .dshade{height:100vh}
.mob .hero{height:auto;min-height:0;padding:8px 18px 4px;gap:14px}.mob .hslot{display:none}.mob #stage{display:none!important}.mob .hinfo p,.mob .hinfo .desc{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.mob ::-webkit-scrollbar{display:none}
.li .ga{display:none;font-style:normal;font-size:13px;opacity:.75;flex-shrink:0;padding:0 2px;border-radius:6px}.li:hover .ga{display:inline-block}.li .ga:hover{opacity:1;background:#ffffff22}.ai-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
.ai-stat{background:var(--p2);border:1px solid var(--ln);border-radius:12px;padding:10px 12px}.ai-stat small{display:block;color:var(--mu);font-size:12px}.ai-stat b{font-size:16px}.ai-stat em{font-style:normal;font-size:12px;margin-inline-start:6px;padding:1px 7px;border-radius:8px;background:#ffffff14}
.ai-stat em.bad{background:#ef444433;color:#fca5a5}.ai-stat em.ok{background:#22c55e33;color:#86efac}.ai-stat em.mid{background:#f59e0b33;color:#fcd34d}
.ai-modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:10px}
.ai-mode{text-align:start;background:var(--p2);border:1px solid var(--ln);border-radius:14px;padding:14px;cursor:pointer;position:relative;transition:transform .12s}.ai-mode:hover{transform:translateY(-2px)}.ai-mode.on{border-color:var(--foc);box-shadow:0 0 0 1px var(--foc) inset}.ai-mode.dis{opacity:.45;cursor:not-allowed}
.ai-mode b{display:block;font-size:15px;margin-bottom:4px}.ai-mode small{color:var(--mu);font-size:12.5px;line-height:1.6;display:block}.ai-mode .tag{position:absolute;top:10px;inset-inline-end:10px;font-size:11px;padding:2px 8px;border-radius:8px;background:#ffffff14}.ai-mode.on .tag{background:var(--foc);color:#000}
.ai-drop{border:2px dashed var(--ln);border-radius:16px;padding:26px;text-align:center;color:var(--mu);margin-top:10px;transition:border-color .15s,background .15s}.ai-drop.over{border-color:var(--foc);background:#ffffff08;color:var(--tx)}
.ai-job{background:var(--p2);border:1px solid var(--ln);border-radius:14px;padding:14px 16px;margin-top:10px}.ai-job .bar{height:7px;margin-top:10px}.ai-job .bar i{transition:width .5s}.ai-job .meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--mu);font-size:12.5px;margin-top:6px}
.ai-job.done{border-color:#22c55e55}.ai-job.error{border-color:#ef444466}
.ai-chip{display:inline-block;font-size:12px;padding:3px 10px;border-radius:10px;background:#ffffff14;margin-inline-start:8px;vertical-align:middle}
#cmp{position:fixed;inset:0;background:#000;z-index:60;display:none;flex-direction:column}#cmp.show{display:flex}
#cmp .vw{flex:1;position:relative;overflow:hidden;background:#000}#cmp video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
#cmp .after{clip-path:inset(0 0 0 var(--cut,50%))}#cmp .hnd{position:absolute;top:0;bottom:0;left:var(--cut,50%);width:2px;background:#fff;box-shadow:0 0 8px #000;pointer-events:none}#cmp .hnd:after{content:'⇔';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;color:#000;border-radius:50%;width:38px;height:38px;display:grid;place-items:center;font-size:18px}
#cmp .lab{position:absolute;top:14px;padding:4px 12px;border-radius:10px;background:#000a;font-size:13px;pointer-events:none}#cmp .lab.b{left:14px}#cmp .lab.a{right:14px}
#cmp .bar2{display:flex;gap:10px;align-items:center;padding:12px 16px;background:#0a0c0f;border-top:1px solid var(--ln);flex-wrap:wrap}#cmp input[type=range]{flex:1;min-width:200px}
#cmp.sbs .vw{display:flex}#cmp.sbs video{position:relative;width:50%;height:100%;inset:auto}#cmp.sbs .after{clip-path:none}#cmp.sbs .hnd{display:none}
.pc .arb{position:absolute;bottom:8px;inset-inline-start:8px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:7px;background:#16a34a;color:#fff;z-index:1;box-shadow:0 2px 8px #0008}.pc .arb.a1{background:#2563eb}
.li.arf{margin:0 10px 8px;width:calc(100% - 20px);border:1px dashed var(--ln)}.li.arf.on{background:#16a34a33;border-color:#16a34a;border-style:solid}
.sfil{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:10px 0 4px}.chip{padding:7px 14px;border-radius:18px;background:var(--p3);border:1px solid var(--ln);font-size:13.5px}.chip.on{background:#16a34a;border-color:#16a34a;color:#fff}
.li.vfb{margin:0 10px 6px;width:calc(100% - 20px);background:var(--p3)}.li.vfb.on{background:#2563eb33;outline:1px solid #2563eb}
.vmp{margin:0 12px 8px;font-size:11.5px;color:var(--mu);position:relative;padding-bottom:6px}.vmp i{position:absolute;bottom:0;inset-inline-start:0;height:3px;background:#2563eb;border-radius:2px;transition:width .4s}
.vfs h4{font-size:14px;color:var(--mu);margin:16px 0 8px;font-weight:600}.vfs .chips2{display:flex;flex-wrap:wrap;gap:7px}.vfs .chip{cursor:pointer}
.vfs .note{font-size:12.5px;color:var(--mu);margin-top:14px;line-height:1.7}.vfs .row3{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.stp h4{font-size:14.5px;margin:16px 0 8px}.stp .chips2{display:flex;flex-wrap:wrap;gap:7px}.stp p{color:var(--mu);font-size:13px;line-height:1.7}
.pc .gtag{display:block;font-size:11px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.dltabs{flex-wrap:wrap}.dltabs em{font-style:normal;opacity:.7;font-size:12px}.dlf{max-width:170px;font-size:13px;padding:6px 8px;margin-inline-end:6px}
.vqf{margin:0 10px 8px;width:calc(100% - 20px);font-size:13px;padding:6px 8px}
.pc .q4.q2{background:#8b5cf6}.pc .q4.q3{background:#2563eb}.pc .q4.q1{background:#475569}.pc .q4.q0{background:#64748b}
.li .c{margin-inline-start:auto;color:var(--mu);font-size:13px;flex-shrink:0}
.li.foc .c{color:#3a4250}
.li.cur span:first-child::after{content:' ●';color:var(--ac);font-size:10px}
/* TV guide */
.tv{display:flex;flex-direction:column;height:100%}
.hero{height:41vh;min-height:240px;display:flex;gap:28px;padding:20px 28px 14px;position:relative;flex-shrink:0}
.hinfo{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:4px}
.hslot{height:100%;aspect-ratio:16/9;max-width:54%;border-radius:12px;background:#050608;flex-shrink:0;display:grid;place-items:center;color:var(--mu2);font-size:14px;text-align:center;padding:20px;border:1px solid var(--ln)}
.clock{position:absolute;top:16px;inset-inline-start:28px;font-size:19px;font-weight:700;color:#dfe5ec}
.hch{display:flex;align-items:center;gap:12px;color:var(--mu);font-size:15px;margin-bottom:10px}
.hch .lg{width:62px;height:40px}.hch b{color:#dfe5ec}
.htitle{font-size:clamp(22px,2.5vw,36px);font-weight:800;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.htime{color:#c3cad4;font-size:15px;margin-top:9px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hprog{height:4px;background:#2a313b;border-radius:4px;margin-top:11px;max-width:440px;overflow:hidden}.hprog i{display:block;height:100%;background:var(--ac)}
.hdesc{color:var(--mu);font-size:14.5px;line-height:1.75;margin-top:10px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;max-width:860px}
.gbar{display:flex;align-items:center;gap:10px;padding:0 28px 10px;flex-shrink:0}
.gsel{display:flex;align-items:center;gap:10px;background:var(--p2);border:1px solid var(--ln);padding:8px 14px;border-radius:10px;font-weight:700;font-size:14.5px;max-width:340px}
.gsel span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.gsel em{font-style:normal;color:var(--mu);font-size:13px;font-weight:500}
.gsel:hover{border-color:#3b4553}
.epgst{color:var(--mu);font-size:13px;display:flex;align-items:center;gap:4px}
.gnav{margin-inline-start:auto;display:flex;gap:6px}
.gnav button{height:36px;min-width:36px;padding:0 12px;border-radius:9px;background:var(--p2);border:1px solid var(--ln);font-size:14px}
.gnav button:hover{border-color:#3b4553}
.ruler{position:relative;height:30px;flex-shrink:0;border-bottom:1px solid var(--ln);border-top:1px solid var(--ln)}
.tk{position:absolute;top:0;height:100%;padding-inline-start:8px;border-inline-start:1px solid var(--ln);font-size:12.5px;color:var(--mu);line-height:29px;white-space:nowrap}
.rday{position:absolute;inset-inline-start:0;top:0;height:100%;line-height:29px;padding:0 14px;font-size:13px;color:#cfd6df;font-weight:700;background:var(--p1);border-inline-end:1px solid var(--ln);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;z-index:2}
.gbox{position:relative;flex:1;min-height:0}
.gwrap{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden}
.gin{position:relative}
.row{position:absolute;right:0;left:0;height:68px;display:flex;border-bottom:1px solid #14181d}
.cc{width:var(--CHW);flex-shrink:0;display:flex;align-items:center;gap:10px;padding:0 12px 0 10px;cursor:pointer;background:var(--p1);border-inline-end:1px solid var(--ln)}
.cc .n{width:34px;text-align:center;color:var(--mu);font-size:14px;flex-shrink:0}
.cc .lg{width:60px;height:40px}
.cc .nm{font-weight:700;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.cc .ic{color:var(--gold);font-size:13px}.cc .ic.a{color:#7fb6ff}
.row.sel .cc{background:var(--p3)}
.row.playing .cc .nm{color:var(--ac)}
.row.playing .cc .n::before{content:'▶ ';color:var(--ac);font-size:10px}
.tl{position:relative;flex:1;overflow:hidden}
.pg{position:absolute;top:5px;bottom:5px;border-radius:8px;background:var(--p2);padding:8px 11px;overflow:hidden;cursor:pointer;white-space:nowrap;border:1px solid transparent}
.pg b{display:block;font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis}
.pg small{display:block;font-size:12px;color:var(--mu);margin-top:3px;overflow:hidden;text-overflow:ellipsis}
.pg.past{background:#0f1215;color:#8f99a5}
.pg.now{background:#1c2531}
.pg.arc b::before{content:'⟲ ';color:#7fb6ff}
.pg.foc{background:var(--foc)!important;color:#0a0c0f;border-color:var(--foc)}
.pg.foc small{color:#3a4250}
.pg:hover:not(.foc){border-color:#3a4452}
.pg.empty{color:var(--mu2);font-size:13px;display:flex;align-items:center}
.nowl{position:absolute;top:0;bottom:0;width:2px;background:var(--red);z-index:3;pointer-events:none;display:none}
.tknow{position:absolute;bottom:0;width:10px;height:10px;border-radius:50%;background:var(--red);transform:translate(50%,50%);z-index:3}
[dir=ltr] .tknow{transform:translate(-50%,50%)}
.gempty{padding:60px;text-align:center;color:var(--mu)}
.gpanel{position:fixed;top:0;bottom:0;inset-inline-start:var(--rail);width:340px;background:#0c0f13f7;backdrop-filter:blur(10px);z-index:25;transform:translateX(110%);transition:transform .18s;display:flex;flex-direction:column;border-inline-end:1px solid var(--ln);padding:18px 10px}
[dir=ltr] .gpanel{transform:translateX(-110%)}
.gpanel.open,[dir=ltr] .gpanel.open{transform:none}
.gph{display:flex;justify-content:space-between;align-items:center;font-size:19px;font-weight:800;padding:4px 10px 14px}
.gpl{overflow:auto;flex:1}
.x{font-size:26px;color:var(--mu);line-height:1;width:36px;height:36px;border-radius:50%}.x:hover{background:var(--p3);color:var(--tx)}
/* stage / player */
#stage{position:fixed;z-index:20;background:#000;overflow:hidden;display:none;border-radius:12px}
#stage.on{display:block}
#stage{container-type:size}
#subs{position:absolute;left:4%;right:4%;bottom:7%;z-index:3;text-align:center;pointer-events:none;font-weight:700;font-size:calc(var(--subsz,4.4) * 1cqh);line-height:1.45;color:#fff;transition:bottom .2s}
#subs span{display:inline-block;unicode-bidi:plaintext;text-shadow:0 0 3px #000,0 0 3px #000,0 2px 5px #000,0 0 1px #000;padding:1px 10px;border-radius:6px;white-space:pre-line}
#subs.bg span{background:#000c;text-shadow:none}
body.pm #stage.ui.vd #subs{bottom:30%}body.pm #stage.ui.lv #subs{bottom:30%}
body.pm #stage{inset:0!important;width:auto!important;height:auto!important;border-radius:0;z-index:40;cursor:none}
body.pm #stage.ui{cursor:default}
#v{width:100%;height:100%;display:block;background:#000;object-fit:contain}
#enh{position:absolute;inset:0;width:100%;height:100%;display:none;pointer-events:none}
#stage.enh #enh{display:block}#stage.enh #v{opacity:0}
.ovl{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:20px;color:#cfd6df;font-size:14px;line-height:1.8;background:#0008;z-index:2}
.ovl.show{display:grid}.ovl b{font-size:17px;color:#fff}.ovl p{margin:6px 0 12px}
.pmui{display:none}
body.pm #stage.ui #topBar{display:flex}
body.pm #stage.ui.lv #liveBar,body.pm #stage.ui.vd #vodBar{display:block}
#topBar{position:absolute;top:0;right:0;left:0;padding:20px 26px 40px;background:linear-gradient(#000d,transparent);z-index:4;align-items:center;gap:10px}
#topBar .tt{font-weight:800;font-size:18px;text-shadow:0 0 8px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.qb{font-size:12.5px;background:#ffffff1c;padding:4px 10px;border-radius:20px;white-space:nowrap;color:#dfe5ec}.qb.on{background:linear-gradient(90deg,#1a63ff55,#8a5cff55);color:#fff}
.cb{height:42px;min-width:42px;padding:0 15px;border-radius:21px;background:#ffffff1c;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:14px;white-space:nowrap}
.cb:hover{background:#ffffff36}.cb.p{background:#fff;color:#000}.cb.sm{height:34px;padding:0 12px;font-size:13px}
#liveBar{position:absolute;bottom:0;left:0;right:0;padding:50px 38px 22px;background:linear-gradient(transparent,#000e 40%);z-index:3}
.lb{display:flex;gap:22px;align-items:center}
.lb>.lg{width:120px;height:76px;border-radius:12px;font-size:20px}
.lbm{flex:1;min-width:0}
.lb1{display:flex;align-items:center;gap:10px;font-size:15px;color:#cfd6df}
.lb1 .num{background:#ffffff22;padding:1px 10px;border-radius:6px;font-weight:700}
.lb1 b{font-size:19px;color:#fff}.lb1 .grp{color:var(--mu);font-size:13px}
.lb2{font-size:27px;font-weight:800;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbp{display:flex;align-items:center;gap:12px;margin-top:10px;font-size:13.5px;color:#cfd6df}
.lbp .bar{flex:1;height:5px}
.lb3{margin-top:8px;color:var(--mu);font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbclk{font-size:32px;font-weight:800;align-self:flex-start}
.hintk{color:#ffffff70;font-size:12.5px;margin-top:12px}
#vodBar{position:absolute;bottom:0;left:0;right:0;padding:50px 42px 26px;background:linear-gradient(transparent,#000e 45%);z-index:3}
.vbt{font-size:24px;font-weight:800}
.vbs{color:#c3cad3;font-size:14.5px;margin-top:4px}
.seek{display:flex;align-items:center;gap:14px;font-size:14px;color:#dfe5ec;margin-top:16px;font-variant-numeric:tabular-nums}
.sbar{flex:1;height:6px;background:#ffffff2e;border-radius:6px;position:relative;cursor:pointer}
.sbar::before{content:'';position:absolute;inset:-10px 0}
.sbar i{position:absolute;left:0;top:0;bottom:0;background:var(--ac);border-radius:6px}.sbar i.bf{background:#ffffff40}
.sbar b{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:#fff;transform:translate(-50%,-50%)}
.vbb{display:flex;align-items:center;gap:10px;margin-top:16px}
#side{position:absolute;top:0;bottom:0;inset-inline-start:0;width:450px;max-width:92vw;background:linear-gradient(270deg,#06080bf7 75%,#06080bd8);z-index:6;display:none;flex-direction:column;padding:20px 12px;cursor:default}
[dir=ltr] #side{background:linear-gradient(90deg,#06080bf7 75%,#06080bd8)}
#side.open{display:flex}
.sh{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;font-size:18px}.sh b{font-weight:800}.sh em{font-style:normal;color:var(--mu);font-size:13px}
.sl{overflow:auto;flex:1;position:relative}
.sc{position:absolute;left:0;right:0;height:60px;display:grid;grid-template-columns:40px 64px 1fr;gap:10px;align-items:center;padding:0 10px;border-radius:10px;cursor:pointer}
.sc:hover{background:#ffffff12}
.sc .lg{width:64px;height:40px}
.sc .sn{text-align:center;color:var(--mu);font-size:14px}
.sc .sm{min-width:0}.snm{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spp{color:var(--mu);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:2px 0 4px}
.sc.foc{background:var(--foc);color:#0a0c0f}.sc.foc .spp,.sc.foc .sn{color:#3a4250}
.sc.cur .snm{color:var(--ac)}.sc.foc.cur .snm{color:#0b4fb8}
#numBox{position:fixed;top:24px;left:30px;font-size:56px;font-weight:800;background:#000c;padding:4px 26px;border-radius:16px;z-index:70;display:none;border:1px solid #ffffff22}
/* VOD */
.vs{display:flex;flex-direction:column;height:100%}
.vhero{height:38vh;min-height:230px;position:relative;overflow:hidden;flex-shrink:0}
.vhbg{position:absolute;top:0;bottom:0;inset-inline-end:0;width:75%;background:center 25%/cover no-repeat}
.vhshade{position:absolute;inset:0;background:linear-gradient(to left,var(--bg) 32%,#0a0c0fb0 52%,transparent 80%),linear-gradient(to top,var(--bg) 0%,transparent 45%)}
[dir=ltr] .vhshade{background:linear-gradient(to right,var(--bg) 32%,#0a0c0fb0 52%,transparent 80%),linear-gradient(to top,var(--bg) 0%,transparent 45%)}
.vhinfo{position:absolute;inset-inline-start:28px;bottom:18px;width:min(620px,52%)}
.vhinfo h1{font-size:clamp(24px,2.6vw,38px);font-weight:800;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vhinfo p{color:#bfc7d1;font-size:14.5px;line-height:1.75;margin-top:10px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.chips{display:flex;flex-wrap:wrap;gap:6px 12px;color:#c9d0d9;font-size:15px;margin-top:10px;align-items:center}
.rate{color:var(--gold);font-weight:800}
.vmain{flex:1;display:flex;min-height:0}
.vgroups{width:270px;flex-shrink:0;display:flex;flex-direction:column;border-inline-end:1px solid var(--ln);padding:4px 10px 10px}
.vsrch input,.sbox input{width:100%;background:var(--p2);border:1px solid var(--ln);border-radius:10px;padding:10px 13px;outline:0;margin:4px 0 10px}
.vsrch input:focus,.sbox input:focus{border-color:var(--ac)}
.vgl{overflow:auto;flex:1}
.vgrid{flex:1;overflow:auto;overscroll-behavior:contain;padding:10px 22px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(146px,1fr));gap:20px 16px;align-content:start}
.pc{cursor:pointer;position:relative;min-width:0}
.pc .im{aspect-ratio:2/3;border-radius:10px;background:#141820;position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s;will-change:transform;contain:paint}
.pc .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pc .ini{position:absolute;inset:0;display:grid;place-items:center;font-size:28px;font-weight:800;color:var(--mu2);padding:10px;text-align:center}
.pc.foc .im,.pc:hover .im{transform:scale(1.04);box-shadow:0 0 0 3px var(--foc),0 14px 30px #000a}
.pc .nm{font-size:13.5px;font-weight:700;margin-top:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .yr{font-size:12px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .rt{position:absolute;top:7px;left:7px;background:#000c;color:var(--gold);font-size:11.5px;padding:2px 7px;border-radius:6px;font-weight:700}
.pc .hdr{position:absolute;top:8px;left:7px;background:linear-gradient(90deg,#ff6a00,#ffd000 50%,#00d4ff);color:#000;font-size:10px;padding:1px 6px;border-radius:5px;font-weight:900;letter-spacing:.5px}.tag.hdr{background:linear-gradient(90deg,#ff6a00,#ffd000 50%,#00d4ff);color:#000;font-weight:900}
.pc .q4{position:absolute;bottom:8px;left:7px;background:linear-gradient(90deg,#f5c518,#ffdd6b);color:#1b1400;font-size:11px;padding:1px 7px;border-radius:5px;font-weight:800}
.pc .fv{position:absolute;top:5px;right:8px;color:var(--gold);font-size:17px;text-shadow:0 0 5px #000}
.pc .rmx{position:absolute;top:6px;left:6px;width:28px;height:28px;border-radius:50%;background:#000c;color:#fff;font-size:15px;display:none;place-items:center;z-index:2;border:1px solid #ffffff40}.pc:hover .rmx,.pc.foc .rmx{display:grid}.pc .rmx:hover{background:var(--red)}
.pc .pr{position:absolute;bottom:0;left:0;right:0;height:4px;background:#000a}.pc .pr i{display:block;height:100%;background:var(--red)}
.pc.na{opacity:.5}.pc.na:hover .im{box-shadow:none;transform:none}
.empty2{grid-column:1/-1;text-align:center;color:var(--mu);padding:60px}
/* detail */
.det{height:100%;overflow:auto;position:relative}
.dbg{position:fixed;top:0;inset-inline-start:var(--rail);inset-inline-end:0;height:80vh;background:center 20%/cover no-repeat;opacity:.5}
.dshade{position:fixed;top:0;inset-inline-start:var(--rail);inset-inline-end:0;height:80vh;background:linear-gradient(to left,var(--bg) 22%,#0a0c0fc0 50%,#0a0c0f40),linear-gradient(to top,var(--bg) 0%,transparent 55%)}
[dir=ltr] .dshade{background:linear-gradient(to right,var(--bg) 22%,#0a0c0fc0 50%,#0a0c0f40),linear-gradient(to top,var(--bg) 0%,transparent 55%)}
.dc{position:relative;padding:24px 40px 70px;z-index:1}
.dback{height:40px;padding:0 16px;border-radius:20px;background:#ffffff18;font-size:14px}.dback:hover{background:#ffffff30}
.dtop{display:flex;gap:32px;align-items:flex-start;margin-top:34px}
.dpost{width:230px;flex-shrink:0;aspect-ratio:2/3;border-radius:14px;background:#151920 center/cover no-repeat;box-shadow:0 24px 60px #000c;display:grid;place-items:center;font-size:40px;font-weight:800;color:var(--mu2)}
.dm{flex:1;min-width:0}
.dm h1{font-size:clamp(28px,3.2vw,46px);font-weight:800;line-height:1.2}
.dm .ot{color:var(--mu);font-size:16px;margin-top:4px}
.plot{max-width:860px;color:#c7ced7;font-size:16px;line-height:1.95;margin-top:16px}
.plot.mu{color:var(--mu)}
.crew{color:var(--mu);font-size:14.5px;margin-top:8px}.crew b{color:#dfe5ec;font-weight:500}
.qrow{display:flex;align-items:center;gap:8px;margin-top:16px;flex-wrap:wrap;color:var(--mu);font-size:14px}
.qv{padding:6px 14px;border-radius:20px;background:#ffffff14;font-weight:800;font-size:13.5px;border:1px solid transparent}
.qv.on{background:#3b2a05;color:var(--gold);border-color:#8a6a10}
.dbtns{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap}.dbtns.c{justify-content:center}
.bt{height:50px;padding:0 24px;border-radius:12px;background:#ffffff1a;display:inline-flex;align-items:center;gap:9px;font-size:15.5px;font-weight:700;border:2px solid transparent;text-decoration:none;color:var(--tx)}
.bt:hover,.bt:focus-visible{background:#ffffff30;outline:none;border-color:#ffffff60}
.bt.p{background:#fff;color:#000}.bt.p:hover,.bt.p:focus-visible{background:#dde4ec}
.sec{margin-top:40px}.sec h3{font-size:20px;margin-bottom:16px;font-weight:800}
.cast{display:flex;gap:20px;overflow-x:auto;padding:4px 4px 12px}
.cm{width:120px;flex-shrink:0;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:flex-start}
.cm .ph{width:108px;height:108px;border-radius:50%;margin:0 auto;background:#1a1f27 center 20%/cover no-repeat;display:grid;place-items:center;font-size:26px;font-weight:800;color:var(--mu);border:3px solid transparent;transition:.15s}
.cm .ph.sk{animation:pl 1.2s infinite alternate}@keyframes pl{to{opacity:.4}}
.cm:hover .ph,.cm:focus-visible .ph{border-color:#fff;transform:scale(1.06)}.cm:focus-visible{outline:none}
.cm b{display:block;font-size:13.5px;margin-top:10px;line-height:1.35}
.cm small{display:block;color:var(--mu);font-size:12px;margin-top:3px;line-height:1.35}
.prow{display:flex;gap:16px;overflow-x:auto;padding:6px 6px 14px}.prow .pc{width:150px;flex-shrink:0}
.seasons{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.seasons button{padding:9px 18px;border-radius:22px;background:#ffffff14;font-size:14px;font-weight:700}
.seasons button.on{background:#fff;color:#000}
.eps{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.ep{display:flex;gap:14px;padding:10px;border-radius:12px;background:#ffffff08;cursor:pointer;border:2px solid transparent;text-align:start;align-items:flex-start}
.ep:hover,.ep:focus-visible{background:#ffffff14;border-color:#ffffff40;outline:none}
.ep .th{width:156px;flex-shrink:0;aspect-ratio:16/9;border-radius:8px;background:#151920 center/cover no-repeat;position:relative;display:grid;place-items:center;color:var(--mu);font-size:20px;overflow:hidden}
.ep .th .pr{position:absolute;bottom:0;left:0;right:0;height:4px;background:#000a}.ep .th .pr i{display:block;height:100%;background:var(--red)}
.ep .eb{min-width:0}.ep .et{font-weight:700;font-size:14.5px}.ep .em{color:var(--mu);font-size:12.5px;margin-top:3px}
.ep .ed{color:#aab3be;font-size:12.5px;margin-top:6px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wd{color:var(--ok)}
.act{display:flex;gap:32px;margin-top:30px;align-items:flex-start}
.aph{width:230px;aspect-ratio:2/3;border-radius:16px;background:#151920 center/cover no-repeat;flex-shrink:0;display:grid;place-items:center;font-size:52px;font-weight:800;color:var(--mu2);box-shadow:0 24px 60px #000c}
.am{flex:1;min-width:0}.am h1{font-size:clamp(28px,3vw,44px);font-weight:800}
.bio{color:#bfc7d1;line-height:1.95;font-size:15px;max-width:900px;margin-top:14px;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.bio.full{display:block}
.more{color:var(--ac);font-size:14px;margin-top:6px}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:20px 16px}
.plot,.ed,.et,.hdesc,.vhinfo p,.vhinfo h1,.bio,.dm h1,.ot,.htitle,.lb2,.vbt,.vbs,.crew{unicode-bidi:plaintext}
[dir=rtl] :is(.plot,.ed,.et,.hdesc,.vhinfo p,.vhinfo h1,.bio,.dm h1,.ot,.htitle,.lb2,.vbt,.vbs,.crew){text-align:right}
[dir=ltr] :is(.plot,.ed,.et,.hdesc,.vhinfo p,.vhinfo h1,.bio,.dm h1,.ot,.htitle,.lb2,.vbt,.vbs,.crew){text-align:left}
/* search */
.srch{height:100%;overflow:auto;padding:30px 40px 60px}
.sbox input{font-size:21px;padding:16px 20px;border-radius:14px}
.schs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.sch,.spr{display:flex;align-items:center;gap:12px;background:var(--p2);border-radius:12px;padding:10px 12px;text-align:start;border:1px solid transparent;min-width:0}
.sch:hover,.spr:hover{border-color:#3a4452}
.sch .lg{width:58px;height:38px}.sch div{min-width:0}.sch b,.spr b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sch small,.spr small{display:block;color:var(--mu);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sprs{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px}
.spr .tm{color:var(--ac);font-size:12.5px;width:120px;flex-shrink:0}.spr div{flex:1;min-width:0}
/* settings */
.st{display:flex;height:100%}
.stn{width:280px;border-inline-end:1px solid var(--ln);padding:26px 12px;flex-shrink:0;background:var(--p1);overflow:auto}
.stn h2{font-size:23px;padding:0 12px 18px}
.stc{flex:1;overflow:auto;padding:32px 40px 70px}
.stc>*{max-width:860px}
.stc h3{font-size:21px;margin-bottom:6px}.stc h3.mt{margin-top:30px}
.sd{color:var(--mu);font-size:14px;line-height:1.8}
.opt{display:flex;align-items:center;gap:12px;background:var(--p2);border:1px solid var(--ln);border-radius:14px;padding:14px 16px;margin-top:10px;flex-wrap:wrap}
.opt.col{flex-direction:column;align-items:stretch}.opt.sm{padding:10px 16px}
.opt .f{flex:1;min-width:200px}.opt b{display:block;font-size:15px}.opt small{display:block;color:var(--mu);font-size:13px;margin-top:2px;line-height:1.6;word-break:break-word}
.sw{width:48px;height:28px;border-radius:14px;background:#39414c;position:relative;flex-shrink:0}
.sw::after{content:'';position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.15s}
.sw.on{background:var(--ac)}.sw.on::after{inset-inline-start:23px}
.in{width:100%;background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:10px 12px;outline:0;direction:ltr;text-align:left}
.in.r{direction:inherit;text-align:start}.in:focus{border-color:var(--ac)}
select.in{width:auto;direction:inherit;text-align:start;cursor:pointer}
.btn{background:var(--p3);border:1px solid var(--ln);padding:9px 16px;border-radius:10px;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--ac)}.btn.p{background:#1d5fc4;border-color:#1d5fc4;color:#fff}.btn.d{color:var(--red)}
.row2{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.tabs2{display:flex;gap:6px;margin:14px 0 4px}
.tabs2 button{padding:8px 18px;border-radius:20px;background:var(--p3);font-size:14px}.tabs2 button.on{background:var(--foc);color:#000}
.howto{margin-top:18px;background:#0f1a27;border:1px solid #1f3550;border-radius:14px;padding:16px 18px;line-height:2;font-size:14.5px}
.howto ol{padding-inline-start:20px;margin-top:6px}
.keys{display:grid;gap:8px;margin-top:14px}.keys div{display:flex;gap:14px;align-items:center;font-size:14.5px}
kbd{min-width:110px;text-align:center;background:var(--p3);border:1px solid var(--ln);border-bottom-width:3px;border-radius:8px;padding:4px 10px;font-family:inherit;font-size:13px}
.keys h4{margin-top:14px;color:var(--mu);font-size:14px}
.langsw{display:inline-flex;background:var(--p2);border:1px solid var(--ln);border-radius:22px;padding:3px;margin-top:22px}
.langsw button{padding:7px 18px;border-radius:18px;font-size:14px;color:var(--mu)}.langsw button.on{background:var(--foc);color:#000;font-weight:700}
/* empty */
.empty{display:grid;place-items:center;height:100%;text-align:center;color:var(--mu);padding:30px;line-height:1.9}
.empty h2{color:var(--tx);font-size:26px;margin:10px 0 4px}
.bigLogo{width:min(420px,70vw);height:auto;display:block;margin:0 auto 18px}
/* modal */
.mbg{position:fixed;inset:0;background:#000b;display:none;place-items:center;z-index:80;padding:20px}
.mbg.show{display:grid}
.modal{background:var(--p2);border:1px solid var(--ln);border-radius:18px;width:min(560px,100%);max-height:92vh;overflow:auto;padding:22px}
.modal h2{font-size:20px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.tabs{display:flex;gap:6px;background:var(--bg);padding:4px;border-radius:12px;margin-bottom:12px}

/* ================= قوائم M3U ================= */
function parseM3U(txt){
  const lines=txt.split(/\r?\n/);let epg='';const out=[];let cur=null;
  for(const raw of lines){const l=raw.trim();if(!l)continue;
    if(/^#EXTM3U/i.test(l)){const m=l.match(/(?:url-tvg|x-tvg-url)\s*=\s*"([^"]+)"/i);if(m)epg=m[1];continue}
    if(/^#EXTINF/i.test(l)){
      const a=n=>{const m=l.match(new RegExp('\\b'+n+'\\s*=\\s*"([^"]*)"','i'));return m?m[1].trim():''};
      const st=l.replace(/\s[\w-]+\s*=\s*"[^"]*"/g,'');const ci=st.indexOf(',');
      cur={epgId:a('tvg-id'),logo:a('tvg-logo'),group:a('group-title')||NOCAT(),num:a('tvg-chno')||a('channel-number'),
        name:(ci>=0?st.slice(ci+1):'').trim()||a('tvg-name')||L('بدون اسم','Untitled'),cu:a('catchup')||a('catchup-type'),cuSrc:a('catchup-source'),cuDays:+(a('catchup-days')||a('timeshift')||a('tvg-rec'))||0};
      continue}
    if(/^#EXTGRP:/i.test(l)){if(cur)cur.group=l.slice(8).trim()||cur.group;continue}
    if(l[0]==='#')continue;
    if(!cur){let n=l.split('/').pop()||'';try{n=decodeURIComponent(n)}catch(e){}cur={group:NOCAT(),name:n.slice(0,60),logo:'',epgId:''}}
    cur.url=l;out.push(cur);cur=null;
  }
  return {items:out,epg};
}
function buildM3U(items,pid){
  const live=[],movies=[],sm=new Map();let n=0;const SE=/^(.*?)[\s._\-|]*S(\d{1,2})[\s._-]*E(\d{1,3})/i;const VID=/\.(mp4|mkv|avi|mov|m4v|webm)(\?|$)/i;
  items.forEach((it,ix)=>{const u=it.url;const isSer=/\/series\//i.test(u);const isMov=/\/movie\//i.test(u)||(!isSer&&VID.test(u));const m=it.name.match(SE);
    if(isSer||(m&&VID.test(u))){
      const sname=(m&&m[1].trim())||cleanTitle(it.name);const key=pid+'|S'+norm(sname)+'|'+it.group;
      let s=sm.get(key);if(!s){s={kind:'series',key,name:sname,title:cleanTitle(sname),logo:it.logo,group:it.group,year:yearOf(sname),added:ix,eps:{}};sm.set(key,s)}
      const sn=m?String(+m[2]):'1';const list=s.eps[sn]||(s.eps[sn]=[]);
      list.push({id:'u'+ix,episode_num:m?+m[3]:list.length+1,title:it.name,url:u,info:{movie_image:''}});s.added=ix;
    }else if(isMov){movies.push({kind:'movie',key:pid+'|'+u,name:it.name,title:cleanTitle(it.name),logo:it.logo,group:it.group,year:yearOf(it.name),added:ix,url:u})}
    else{n++;const arc=!!(it.cu||it.cuSrc||it.cuDays);live.push({kind:'live',key:pid+'|'+u,name:it.name,logo:it.logo,group:it.group,epgId:it.epgId,num:it.num||String(n),url:u,archive:arc,archiveDays:it.cuDays||(arc?7:0),cu:it.cu,cuSrc:it.cuSrc})}
  });
  const series=[...sm.values()];series.forEach(s=>{for(const k in s.eps)s.eps[k].sort((a,b)=>a.episode_num-b.episode_num)});
  return {live,movies,series};
}

/* ================= إكستريم كودز ================= */
async function xt(P,action,extra=''){
  const u=`${P.server}/player_api.php?username=${enc(P.user)}&password=${enc(P.pass)}${action?'&action='+action:''}${extra}`;
  const r=await fetch(u);if(!r.ok)throw new Error('HTTP '+r.status);const t=await r.text();
  try{return JSON.parse(t)}catch(e){throw new Error(L('رد غير مفهوم من السيرفر','The server sent an unreadable response'))}
}
async function loadXtream(P){
  const auth=await xt(P,'');
  if(!auth||!auth.user_info||+auth.user_info.auth===0)throw new Error(L('اسم المستخدم أو كلمة المرور غير صحيحة','Wrong username or password'));
  S.info=auth.user_info;S.serverTz=(auth.server_info&&auth.server_info.timezone)||null;
  const acts=['get_live_categories','get_live_streams','get_vod_categories','get_vod_streams','get_series_categories','get_series'];
  const res=await Promise.allSettled(acts.map(a=>xt(P,a)));
  const v=i=>res[i].status==='fulfilled'&&Array.isArray(res[i].value)?res[i].value:[];
  const cm=a=>Object.fromEntries(a.map(c=>[String(c.category_id),c.category_name]));
  const lc=cm(v(0)),vc=cm(v(2)),sc=cm(v(4));
  const ext=S.settings.fmt==='ts'?'ts':'m3u8';const cred=`${enc(P.user)}/${enc(P.pass)}`;
  const r5=x=>x&&+x?(+x*2).toFixed(1):'';
  S.live=v(1).map((s,i)=>({kind:'live',key:P.id+'|l'+s.stream_id,id:s.stream_id,name:s.name||'',logo:s.stream_icon||'',group:lc[String(s.category_id)]||NOCAT(),epgId:s.epg_channel_id||'',num:String(s.num||i+1),url:`${P.server}/live/${cred}/${s.stream_id}.${ext}`,archive:+s.tv_archive===1,archiveDays:+s.tv_archive_duration||0}));
  S.live.sort((a,b)=>(+a.num||0)-(+b.num||0));
  S.movies=v(3).map(s=>({kind:'movie',key:P.id+'|m'+s.stream_id,id:s.stream_id,name:s.name||'',title:cleanTitle(s.name),logo:s.stream_icon||'',group:vc[String(s.category_id)]||NOCAT(),rating:r5(s.rating_5based)||(s.rating&&+s.rating?(+s.rating).toFixed(1):''),year:+s.year||yearOf(s.name)||null,added:+s.added||0,tmdb:s.tmdb||s.tmdb_id||null,genre:s.genre||'',cast:s.cast||'',url:`${P.server}/movie/${cred}/${s.stream_id}.${s.container_extension||'mp4'}`}));
  S.series=v(5).map(s=>({kind:'series',key:P.id+'|s'+s.series_id,seriesId:s.series_id,name:s.name||'',title:cleanTitle(s.name),logo:s.cover||'',group:sc[String(s.category_id)]||NOCAT(),rating:r5(s.rating_5based)||(s.rating&&+s.rating?(+s.rating).toFixed(1):''),year:yearOf(s.releaseDate||s.release_date||s.name),added:+s.last_modified||0,plot:s.plot||'',tmdb:s.tmdb||s.tmdb_id||null,genre:s.genre||'',cast:s.cast||'',director:s.director||''}));
  S.gOrder={live:v(0).map(c=>c.category_name),movies:v(2).map(c=>c.category_name),series:v(4).map(c=>c.category_name)};
  return P.epgUrl||`${P.server}/xmltv.php?username=${enc(P.user)}&password=${enc(P.pass)}`;
}

/* ================= دليل البرامج ================= */
function pt(s){if(!s)return 0;const m=s.match(/^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})?\s*([+-]\d{4})?/);if(!m)return 0;

function subRank(list,item,season,ep){const pref=S.settings.subLang||'ar';const v=V&&V();const h=v&&v.videoHeight||0;

  const nm=String((S.vod&&S.vod.it&&S.vod.it.name)||item.name||'').toLowerCase();const src=/web[-. ]?dl|webrip|web\b/i.test(nm)?/web/i:/blu[-. ]?ray|bdrip|brrip/i.test(nm)?/blu|bd|br/i:null;
  const se=r=>{const m=String(r).match(/s(\d{1,2})[ ._-]*e(\d{1,3})|\b(\d{1,2})x(\d{2,3})\b/i);return m?[+(m[1]||m[3]),+(m[2]||m[4])]:null};
  const seen=new Set();

      c.score=sc;return c}).sort((a,b)=>b.score-a.score)}

function parseSubs(txt){txt=String(txt).replace(/^﻿/,'').replace(/\r\n?/g,'\n');

/* ================= صور الممثلين وأعمالهم من ويكيبيديا (بدون مفتاح) ================= */
const wcache=new Map();
function jget(u){if(wcache.has(u))return wcache.get(u);const pr=fetch(u).then(r=>{if(!r.ok)throw new Error('wiki '+r.status);return r.json()});wcache.set(u,pr);pr.catch(()=>wcache.delete(u));return pr}
const WP=l=>`https://${l}.wikipedia.org/w/api.php?format=json&formatversion=2&origin=*&`;
const WD='https://www.wikidata.org/w/api.php?format=json&origin=*&';
const commons=(f,w=300)=>{if(!f)return'';f=String(f).replace(/^https?:\/\/commons\.wikimedia\.org\/wiki\/Special:FilePath\//,'');try{f=decodeURIComponent(f)}catch(e){}return `https://commons.wikimedia.org/wiki/Special:FilePath/${enc(f.replace(/ /g,'_'))}?width=${w}`};
const pickLbl=(ar,en)=>LANG==='ar'?(ar||en):(en||ar);
async function sparql(q){const d=await jget('https://query.wikidata.org/sparql?format=json&query='+enc(q));return (d.results&&d.results.bindings)||[]}
async function wpPeople(names){
  const out=names.map(n=>({name:n,photo:'',qid:null}));const groups={en:[],ar:[]};names.forEach((n,i)=>groups[hasAr(n)?'ar':'en'].push(i));
  for(const lang of ['en','ar']){const idx=groups[lang];
    for(let s=0;s<idx.length;s+=40){const part=idx.slice(s,s+40);
      const d=await jget(WP(lang)+'action=query&redirects=1&prop=pageimages|pageprops&piprop=thumbnail&pithumbsize=300&ppprop=wikibase_item|disambiguation&titles='+enc(part.map(i=>names[i]).join('|')));
      const q=d.query||{};const n1={},red={},pages={};(q.normalized||[]).forEach(x=>n1[x.from]=x.to);(q.redirects||[]).forEach(x=>red[x.from]=x.to);(q.pages||[]).forEach(p=>pages[p.title]=p);
      part.forEach(i=>{let t=names[i];t=n1[t]||t;t=red[t]||t;const p=pages[t];if(!p||p.missing||!p.pageprops||p.pageprops.disambiguation!==undefined)return;
        out[i].photo=p.thumbnail?p.thumbnail.source:'';out[i].qid=p.pageprops.wikibase_item||null})}}
  return out}
async function wdFindWork(title,year,type){const lang=hasAr(title)?'ar':'en';const kw=type==='movie'?(lang==='ar'?'فيلم':'film'):(lang==='ar'?'مسلسل':'TV series');
  const d=await jget(WP(lang)+'action=query&generator=search&gsrlimit=6&prop=pageprops&ppprop=wikibase_item&gsrsearch='+enc(`${title} ${year||''} ${kw}`));
  const ps=((d.query&&d.query.pages)||[]).sort((a,b)=>a.index-b.index);const n=norm(title);
  const best=ps.find(p=>norm(p.title.replace(/\s*\(.*\)\s*$/,''))===n);return best&&best.pageprops?best.pageprops.wikibase_item:null}
async function wdCast(qid){const d=await jget(WD+'action=wbgetentities&props=claims&ids='+qid);const e=d.entities&&d.entities[qid];
  const ids=((e&&e.claims&&e.claims.P161)||[]).map(c=>c.mainsnak&&c.mainsnak.datavalue&&c.mainsnak.datavalue.value.id).filter(Boolean).slice(0,24);if(!ids.length)return[];
  const rows=await sparql(`SELECT ?a (SAMPLE(?im) AS ?img) (SAMPLE(?al) AS ?ar) (SAMPLE(?el) AS ?en) WHERE { VALUES ?a {${ids.map(i=>'wd:'+i).join(' ')}} OPTIONAL{?a wdt:P18 ?im} OPTIONAL{?a rdfs:label ?al FILTER(LANG(?al)="ar")} OPTIONAL{?a rdfs:label ?el FILTER(LANG(?el)="en")} } GROUP BY ?a`);
  const by={};rows.forEach(r=>by[r.a.value.split('/').pop()]=r);
  return ids.map(id=>{const r=by[id]||{};return{qid:id,name:pickLbl(r.ar&&r.ar.value,r.en&&r.en.value)||id,photo:r.img?commons(r.img.value,300):'',role:''}}).filter(c=>!/^Q\d+$/.test(c.name))}
async function wpPosters(titles){const out={};for(let s=0;s<titles.length;s+=40){const part=titles.slice(s,s+40);try{
    const d=await jget(WP('en')+'action=query&redirects=1&prop=pageimages&piprop=thumbnail&pithumbsize=342&pilicense=any&titles='+enc(part.join('|')));const q=d.query||{};const back={};
    (q.normalized||[]).forEach(x=>back[x.to]=x.from);(q.redirects||[]).forEach(x=>back[x.to]=back[x.from]||x.from);(q.pages||[]).forEach(p=>{if(p.thumbnail){out[p.title]=p.thumbnail.source;if(back[p.title])out[back[p.title]]=p.thumbnail.source}})}catch(e){}}return out}
async function wdWorksFallback(qid){const d=await jget(WD+'action=query&list=search&srlimit=100&srsearch='+enc('haswbstatement:P161='+qid));const ids=((d.query&&d.query.search)||[]).map(x=>x.title).filter(t=>/^Q\d+$/.test(t)).slice(0,100);if(!ids.length)return[];
  const out=[];for(let i=0;i<ids.length;i+=50){const e=await jget(WD+'action=wbgetentities&props=labels|claims|sitelinks&languages=ar|en&sitefilter=enwiki&ids='+ids.slice(i,i+50).join('|'));
    for(const [id,en] of Object.entries(e.entities||{})){const cl=en.claims||{};const p31=(cl.P31||[]).map(c=>c.mainsnak&&c.mainsnak.datavalue&&c.mainsnak.datavalue.value.id).filter(Boolean);const ty=p31.find(x=>['Q11424','Q24862','Q506240','Q202866','Q5398426','Q1259759','Q581714','Q117467246'].includes(x));if(!ty)continue;
      const pd=cl.P577&&cl.P577[0]&&cl.P577[0].mainsnak.datavalue;const y=pd&&pd.value&&pd.value.time?pd.value.time.slice(1,5):'';const lb=en.labels||{};const sl=en.sitelinks&&en.sitelinks.enwiki;
      out.push({w:{value:'http://www.wikidata.org/entity/'+id},ty:{value:'http://www.wikidata.org/entity/'+ty},ar:lb.ar?{value:lb.ar.value}:undefined,en:lb.en?{value:lb.en.value}:undefined,y:y?{value:y}:undefined,wp:sl?{value:'https://en.wikipedia.org/wiki/'+sl.title.replace(/ /g,'_')}:undefined,pop:{value:String((en.sitelinks&&Object.keys(en.sitelinks).length)||0)}})}}
  return out.sort((a,b)=>+b.pop.value-+a.pop.value)}
async function wpFindPerson(name){const lang=hasAr(name)?'ar':'en';const d=await jget(WP(lang)+'action=query&generator=search&gsrlimit=5&prop=pageprops&ppprop=wikibase_item&gsrsearch='+enc(name+(lang==='ar'?' ممثل':' actor')));
  const ps=((d.query&&d.query.pages)||[]).sort((a,b)=>a.index-b.index);const n=norm(name);const best=ps.find(p=>norm(p.title.replace(/\s*\(.*\)\s*$/,''))===n)||ps[0];return best&&best.pageprops?best.pageprops.wikibase_item:null}
async function tvmazeWorks(name){try{const r=await jget('https://api.tvmaze.com/search/people?q='+enc(name));const p=(r||[]).find(x=>norm(x.person.name)===norm(name));if(!p)return{works:[]};

async function wdActor(c){
  let qid=c.qid;if(!qid){try{const r=await wpPeople([c.name]);qid=r[0].qid}catch(e){}}if(!qid){try{qid=await wpFindPerson(c.name)}catch(e){}}if(!qid)throw new Error('nf');

async function actorTmdb(c){let id=c.id;if(!id){const r=await tmdb('/search/person',{query:c.name,language:TL()});id=r.results&&r.results[0]&&r.results[0].id}

  let bio=d.biography;if(!bio&&LANG==='ar'){try{bio=(await tmdb(`/person/${id}`,{language:'en-US'})).biography}catch(e){}}
  const seen=new Set();
  const works=((d.combined_credits&&d.combined_credits.cast)||[]).filter(x=>(x.media_type==='movie'||x.media_type==='tv')&&!(x.media_type==='tv'&&(x.genre_ids||[]).some(g=>g===10767||g===10763)))
    .filter(x=>{const k=x.media_type+x.id;if(seen.has(k))return false;seen.add(k);return true}).sort((a,b)=>(b.vote_count||0)-(a.vote_count||0))
    .map(x=>Object.assign({},x,{poster:x.poster_path?IMG+'w342'+x.poster_path:''}));

function onDlProgress(p){const d=S.dls.find(x=>x.id===p.id);if(!d)return;d.got=p.got;if(p.total)d.total=p.total;d.speed=p.speed;if(p.done){d.state='done';d.file=p.file;saveDls();toast(L('✓ اكتمل التنزيل: ','✓ Download complete: ')+d.title,3000)}else if(p.error){d.state='err';d.err=p.error;saveDls()}
  if(S.screen!=='downloads')return;const row=document.querySelector(`.dl[data-id="${p.id}"]`);if(row&&!p.done&&!p.error){row.querySelector('.bar i').style.width=(d.total?d.got/d.total*100:0)+'%';row.querySelector('small').textContent=dlSub(d)}else renderDownloads()}

function aiApplyRec(){const r=S.ai.analysis&&S.ai.analysis.rec;if(!r)return;S.ai.mode=r.mode;S.ai.opts.target=String(r.target);S.ai.opts.model='auto';S.ai.opts.fps=r.fps||'keep';S.ai.opts.deblock=(r.why||[]).includes('blocky')}

function toggleHidden(kind,g,force){const h=S.hidden[S.active]||(S.hidden[S.active]={});const a=new Set(h[kind]||[]);if(force===true)a.add(g);else if(force===false)a.delete(g);else a.has(g)?a.delete(g):a.add(g);h[kind]=[...a];store.set('hidden',S.hidden);if(kind==='live')S.ch=filterLive()}
function settingsClick(e){const t=e.target.closest('[data-sc2],[data-pa],[data-tg],[data-act],[data-hg],[data-hgt],[data-lang],[data-gk],[data-ga]');if(!t)return;

  if(t.dataset.lang){setLang(t.dataset.lang);return}
  if(t.dataset.sc2){S.setCat=t.dataset.sc2;renderSettings();return}
  if(t.dataset.pa){const [a,id]=t.dataset.pa.split('|');if(a==='add')openAdd();else if(a==='edit')openAdd(id);else if(a==='act')activate(id);else if(a==='reload'){S.screen='tv';loadActive()}else if(a==='del')delPl(id);return}
  if(t.dataset.tg){const k=t.dataset.tg;S.settings[k]=!S.settings[k];saveSet();renderSettingsC();return}
  if(t.dataset.hgt){S.hgTab=t.dataset.hgt;renderSettingsC();return}
  if(t.dataset.hg!=null){toggleHidden(S.hgTab||'live',t.dataset.hg);renderSettingsC();return}
  const a=t.dataset.act;const P=pl();
  if(a==='saveEpg'&&P){P.epgUrl=$('#epgUrlIn').value.trim();store.set('playlists',S.playlists);loadActive()}
  else if(a==='reloadEpg'){if(S.epgUrl)loadEPG(S.epgUrl);else toast(L('ما في رابط دليل برامج','No guide URL'));renderSettingsC()}
  else if(a==='showAll'||a==='hideAll'){const k=S.hgTab||'live';const arr=k==='live'?S.live:k==='movies'?S.movies:S.series;groupsOf(arr).forEach(([g])=>toggleHidden(k,g,a==='hideAll'));renderSettingsC()}
  else if(a==='saveTmdb'){S.settings.tmdb=$('#tmdbKey').value.trim();saveSet();tcache.clear();S.meta={};if(!S.settings.tmdb){renderSettingsC();return}

function setAddType(t){addType=t;$$('#addTabs button').forEach(x=>x.classList.toggle('on',x.dataset.t===t));$$('[data-p]').forEach(p=>p.style.display=p.dataset.p===t?'':'none')}
function openAdd(id){renderAddBody();S.editId=id||null;const P=id?S.playlists.find(p=>p.id===id):null;$('#addTitle').textContent=P?L('تعديل قائمة التشغيل','Edit playlist'):L('إضافة قائمة تشغيل','Add playlist');
  $('#fName').value=P?P.name:'';$('#fServer').value=P&&P.server||'';$('#fUser').value=P&&P.user||'';$('#fPass').value=P&&P.pass||'';$('#fUrl').value=P&&P.url||'';$('#fEpg').value=P&&P.epgUrl||'';
  setAddType(P?P.type:'xtream');$('#addM').classList.add('show');setTimeout(()=>$('#fName').focus(),50)}
async function savePlaylist(){
  const name=$('#fName').value.trim()||L('قائمتي','My playlist');const old=S.editId?S.playlists.find(p=>p.id===S.editId):null;const id=old?old.id:'p'+Date.now();
  const P={id,name,type:addType,epgUrl:$('#fEpg').value.trim()};
  if(addType==='xtream'){let server=$('#fServer').value.trim(),user=$('#fUser').value.trim(),pass=$('#fPass').value.trim();
    const m=server.match(/^(https?:\/\/[^/?#]+)[^?]*\?(.*)$/i);if(m){const q=new URLSearchParams(m[2]);server=m[1];user=user||q.get('username')||'';pass=pass||q.get('password')||''}
    if(!server||!user||!pass){toast(L('عبّ رابط السيرفر واسم المستخدم وكلمة المرور','Fill in the server URL, username and password'));return}
    if(!/^https?:\/\//i.test(server))server='http://'+server;Object.assign(P,{server:server.replace(/\/+$/,'').replace(/\/(player_api|get)\.php.*$/,''),user,pass})}
  else if(addType==='url'){const url=$('#fUrl').value.trim();if(!url){toast(L('حط رابط القائمة','Enter the playlist URL'));return}P.url=url}
  else{const f=$('#fFile').files[0];if(!f&&!(old&&old.type==='file')){toast(L('اختر ملف القائمة','Choose the playlist file'));return}
    if(f){const txt=await f.text();if(!/#EXTINF/i.test(txt)){toast(L('هذا ليس ملف قائمة تشغيل صالح','This isn\'t a valid playlist file'));return}if(!await idb.put('file_'+id,txt)){toast(L('ما قدرت أحفظ الملف','Couldn\'t save the file'));return}}}
  if(old)S.playlists[S.playlists.indexOf(old)]=P;else S.playlists.push(P);store.set('playlists',S.playlists);$('#addM').classList.remove('show');activate(id)}
function activate(id){S.active=id;store.set('active',id);S.screen='tv';S.stack=[];loadActive()}
async function delPl(id){if(!confirm(L('حذف هذه القائمة؟','Delete this playlist?')))return;S.playlists=S.playlists.filter(p=>p.id!==id);store.set('playlists',S.playlists);await idb.del('file_'+id);
  if(S.active===id){S.active=S.playlists[0]?S.playlists[0].id:null;store.set('active',S.active);await loadActive();S.screen='settings'}render()}

function markRail(){const base=S.stack.length?S.stack[0].screen:S.screen;$$('#rail .ri').forEach(b=>b.classList.toggle('on',b.dataset.go===base))}
function go(screen){if((screen==='settings'||screen==='downloads')&&S.screen!==screen&&hasPin()&&!(screen==='settings'?S.setOK:S.dlOK)){askPin(()=>go(screen),screen);return}if(screen!=='settings')S.setOK=false;if(screen!=='downloads')S.dlOK=false;if(screen!=='tv'&&!S.vod&&S.curUrl){stopEngine();S.catchup=null}S.stack=[];S.screen=screen;S.gp=null;render()}
function push(screen,cur){S.stack.push({screen:S.screen,cur:S.cur,scroll:($('#det')||{}).scrollTop||0});if(S.curUrl&&!S.vod){stopEngine();S.catchup=null}S.screen=screen;S.cur=cur;render()}
function back(){const p=S.stack.pop();if(!p){go('tv');return}S.screen=p.screen;S.cur=p.cur;render();const d=$('#det');if(d&&p.scroll)setTimeout(()=>{d.scrollTop=p.scroll},0)}
function render(){markRail();
  const has=S.live.length||S.movies.length||S.series.length;
  if(S.screen==='settings')renderSettings();else if(S.screen==='downloads')renderDownloads();else if(S.screen==='ai')renderAI();else if(!has)renderEmpty();
  else if(S.screen==='tv')renderTV();else if(S.screen==='movies'||S.screen==='series')renderVOD(S.screen);
  else if(S.screen==='detail')renderDetail();else if(S.screen==='actor')renderActor();else if(S.screen==='search')renderSearch();
  placeStage()}

      const vg=e.target.closest('[data-vg]');if(vg){const g=vg.dataset.vg;const gh=e.target.closest('[data-gh]'),gl=e.target.closest('[data-gl]');
        if(gh&&!g.startsWith('__')){toggleHidden(kind,g,true);if(S.vodGroup[kind]===g)S.vodGroup[kind]='__all';toast(L('انخفت «'+g+'» — ترجعها من الإعدادات ← المجموعات','Hid “'+g+'” — restore it in Settings → Groups'),2500);renderVOD(kind);return}
        if(gl&&!g.startsWith('__')){if(toggleLock(kind,g)){if(S.vodGroup[kind]===g&&gLocked(kind,g))S.vodGroup[kind]='__all';renderVOD(kind)}return}
        if(g==='__pfav'&&!S.unlocked){askPin(()=>{S.vodGroup[kind]='__pfav';S.vf=0;renderVOD(kind)});return}
        if(!g.startsWith('__')&&gLocked(kind,g)){askPin(()=>{S.gOpen.add(gKey(kind,g));S.vodGroup[kind]=g;S.vf=0;renderVOD(kind)},'group',g);return}
        S.vodGroup[kind]=g;S.vf=0;renderVOD(kind);return}
      const rmc=e.target.closest('[data-rmc]');if(rmc){const pc2=rmc.closest('[data-p]');const it=S.vlist[+pc2.dataset.p];if(it){removeCont(it);renderVOD(kind)}return}

  });
  scr.addEventListener('dblclick',e=>{if(S.screen==='tv'&&e.target.closest('[data-cc],.pg.now,.pg.empty')&&S.playing&&!S.pm)enterPM()});
  scr.addEventListener('mouseover',e=>{if(S.screen!=='movies'&&S.screen!=='series')return;const pc=e.target.closest('.pc[data-p]');if(!pc)return;const i=+pc.dataset.p;if(i!==S.vf)setVF(i,true)});
  scr.addEventListener('input',debounce(e=>{if(e.target.id==='vq'){const kind=S.screen;S.vodSearch[kind]=e.target.value;S.vlist=vodFiltered(kind);S.vf=0;S.vRendered=0;$('#vgrid').innerHTML='';appendPosters()}},250));

  const st=$('#stage');
  st.addEventListener('click',e=>{
    const a=e.target.closest('[data-a]');if(a){e.stopPropagation();stageAct(a.dataset.a);if(S.pm||S.vod)showUI();return}
    if(!S.pm&&!S.vod){enterPM();return}
    const si=e.target.closest('[data-si]');if(si){const sd=S.side;if(sd&&sd.type==='grp'){const g=sd.items[+si.dataset.si];const gh=e.target.closest('[data-gh]'),gl=e.target.closest('[data-gl]');
        if(g&&g.g&&gh){toggleHidden('live',g.id,true);if(S.tvGroup===g.id){S.tvGroup='__all';S.ch=filterLive()}toast(L('انخفت «'+g.id+'» — ترجعها من الإعدادات ← المجموعات','Hid “'+g.id+'” — restore it in Settings → Groups'),2500);openSide('grp');return}
        if(g&&g.g&&gl){if(toggleLock('live',g.id))openSide('grp');return}}
      sideClick(+si.dataset.si);return}
    if(e.target.closest('#side,#topBar,#liveBar,#vodBar'))return;
    if(S.side){closeSide();return}
    if(S.vod||S.catchup){if(st.classList.contains('ui'))togglePlay();else showUI()}else openSide('ch')});
  st.addEventListener('mousemove',()=>{if((S.pm||S.vod)&&!S.side)showUI()});
  st.addEventListener('contextmenu',e=>{if(S.pm||S.vod){e.preventDefault();openMenu()}});
  st.addEventListener('pointerdown',e=>{const sb=e.target.closest('#sbar');if(!sb)return;const r=sb.getBoundingClientRect();const d=durT();if(d)seekTo(Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*d);showUI()});
  const v=V();v.addEventListener('playing',()=>{hideOvl();ENH.start()});v.addEventListener('waiting',()=>showOvl('load'));
  v.addEventListener('timeupdate',()=>{if(S.vod||S.catchup)updSeek()});v.addEventListener('ended',onEnded);
  v.addEventListener('pause',()=>{if(S.vod){updSeek();showUI()}});v.addEventListener('play',()=>{if(S.vod)updSeek()});
  v.addEventListener('resize',()=>{if(S.pm||S.vod)renderTop()});
  document.addEventListener('pointerdown',()=>{if(S.autoMuted){V().muted=false;S.autoMuted=false}},true);
  $('#subFile').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(f)loadSubFile(f)});
  document.addEventListener('click',e=>{const c=e.target.closest('[data-close]');if(c)$('#'+c.dataset.close).classList.remove('show');if(e.target.classList.contains('mbg'))e.target.classList.remove('show')});
  window.addEventListener('resize',debounce(()=>{placeStage();if(S.screen==='tv'&&!S.pm)renderGrid(true)},80));
  document.addEventListener('fullscreenchange',()=>setTimeout(placeStage,50));
  document.addEventListener('keydown',e=>{if($('#cmp').classList.contains('show')){if(e.key==='Escape')cmpClose();else if(e.key===' '){e.preventDefault();const a=$('#cmp .after');a.paused?a.play():a.pause()}return}
    if(S.autoMuted){V().muted=false;S.autoMuted=false}
    if($('.mbg.show')){if(e.key==='Escape')$$('.mbg.show').forEach(m=>m.classList.remove('show'));return}
    const ae=document.activeElement;if(ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)){if(e.key==='Escape'||(e.key==='Enter'&&ae.id==='vq'))ae.blur();return}
    if(S.pm||S.vod){pmKey(e);return}
    if(S.screen==='tv'&&S.live.length){tvKey(e);return}
    if(S.screen==='movies'||S.screen==='series'){vodKey(e);return}
    if((S.screen==='detail'||S.screen==='actor')&&(e.key==='Escape'||e.key==='Backspace')){e.preventDefault();back();return}
    if(e.key==='/'&&S.screen!=='search'){e.preventDefault();go('search')}});
}

function minuteTick(){const now=Date.now();
  if(S.screen==='tv'&&!S.pm&&S.live.length){if(S.gFocusT==null&&now>S.gT+SPAN-1800e3)S.gT=floor30(now)-1800e3;renderGrid(true);renderHero()}

/* ================= Android (Capacitor) layer: native ExoPlayer + GPU enhancement ================= */
if(MOB){(function(){
  const CAP=window.Capacitor;const NAT=(CAP.registerPlugin?CAP.registerPlugin('SanadNative'):CAP.Plugins.SanadNative);const APP=CAP.Plugins&&CAP.Plugins.App;
  document.documentElement.classList.add('mob');
  let lastInput=0;['pointerdown','touchstart','keydown','click'].forEach(ev=>document.addEventListener(ev,()=>{lastInput=Date.now()},true));
  const userGesture=()=>Date.now()-lastInput<2500;
  const ENHK=['auto','off','normal','strong'];const enhIdx=()=>Math.max(0,ENHK.indexOf(S.settings.enh||'auto'));
  const saveEnh=i=>{if(i==null||i===1&&S.settings.enh!=='off')return;const k=ENHK[i]||'auto';if(S.settings.enh!==k){S.settings.enh=k;saveSet()}};
  const yearOf=o=>{const t=[o&&o.subItem&&(o.subItem.year||o.subItem.name),o&&o.title].filter(Boolean).join(' ');const m=String(t).match(/\b(19[2-9]\d|20[0-4]\d)\b/);return m?+m[1]:0};
  let playing=false;
  async function nativePlay(opts){if(playing)return null;playing=true;try{return await NAT.play(Object.assign({enh:enhIdx(),prefSub:S.settings.subLang||'ar',subScale:[1,1.1,1.25,1.45,1.7][S.settings.subSize]||1.25},opts))}catch(e){toast(L('تعذّر فتح المشغّل: ','Could not open the player: ')+(e&&e.message||e),4000);return null}finally{playing=false}}
  // ---- live TV: always fullscreen native player with zapping list ----
  const origPlayChannel=playChannel;
  playChannel=function(ch,o={}){if(!ch)return;if(!userGesture()){S.playing=ch;return}
    S.catchup=null;S.playing=ch;store.set('lastCh',ch.key);if(!isNT(ch.key)){S.recents=[ch.key,...S.recents.filter(k=>k!==ch.key)].slice(0,40);store.set('recents',S.recents)}
    let list=S.ch&&S.ch.length?S.ch:[ch];let idx=list.findIndex(c=>c.key===ch.key);if(idx<0){list=[ch];idx=0}
    const now=Date.now();const lim=1500;let start=0;if(list.length>lim){start=Math.max(0,Math.min(idx-lim/2,list.length-lim));list=list.slice(start,start+lim);idx-=start}
    const items=list.map(c=>{let e='';try{const p=progAt(c,now);if(p)e=p.title||''}catch(x){}return{n:c.name,u:c.url,k:c.key,e}});
    nativePlay({live:true,list:items,index:idx,title:ch.name,url:ch.url,enh:enhForKind('live')?enhIdx():1}).then(r=>{if(!r)return;saveEnh(r.enh);const c=list[r.index];if(c){S.playing=c;store.set('lastCh',c.key);if(!isNT(c.key)){S.recents=[c.key,...S.recents.filter(k=>k!==c.key)].slice(0,40);store.set('recents',S.recents)}const gi=S.ch.findIndex(x=>x.key===c.key);if(gi>=0)S.gRow=gi}
      if(S.screen==='tv'){S.pm=false;try{renderTV()}catch(e){render()}}})};
  playCatchup=function(ch,p){if(!userGesture())return;nativePlay({live:false,url:catchupUrl(ch,p),title:ch.name+' · '+(p.title||''),key:'cu|'+ch.key,enh:enhForKind('live')?enhIdx():1}).then(r=>{if(r)saveEnh(r.enh)})};
  // ---- movies / episodes ----
  playVod=function(o){if(!o||!o.url)return;S.vod=o;S.pm=false;
    nativePlay({live:false,url:o.url,title:o.title||'',sub:o.sub||'',start:Math.round((o.start||0)*1000),key:o.key||'',prefAudio:prefAudio(o)||'',year:yearOf(o),enh:enhForKind(o.seriesKey?'series':'movie')?enhIdx():1}).then(r=>{
      if(S.vod===o)S.vod=null;if(!r)return;saveEnh(r.enh);
      const nt=isNT(o.key)||(o.baseKey&&isNT(o.baseKey))||(o.seriesKey&&isNT(o.seriesKey));
      if(!o.local&&!nt){if(r.ended){S.resume[o.key]={pos:0,dur:r.dur||1,ts:Date.now(),done:true}}
        else if(r.dur>=60&&r.pos>=5){S.resume[o.key]={pos:r.pos,dur:r.dur,ts:Date.now(),done:r.pos/r.dur>0.93};if(o.baseKey&&o.baseKey!==o.key)S.resume[o.baseKey]=S.resume[o.key]}
        if(o.seriesKey&&(r.ended||r.pos>=5))S.resume[o.seriesKey]={ts:Date.now(),last:o.key,season:o.season,ep:o.epNum};
        store.set('resume',S.resume)}
      if(r.ended&&o.next){toast(L('▶ الحلقة التالية…','▶ Next episode…'),1500);lastInput=Date.now();setTimeout(()=>o.next(),400);return}
      try{if(S.screen==='detail'&&typeof refreshDetail==='function')refreshDetail(false);else render()}catch(e){render()}})};
  closeVod=function(){S.vod=null};
  // ---- external Arabic subtitles when the file has none embedded ----
  const p2=n=>String(n).padStart(2,'0');const ts=x=>{x=Math.max(0,x);const h=Math.floor(x/3600),m=Math.floor(x%3600/60),sc=Math.floor(x%60),ms=Math.round((x%1)*1000)%1000;return `${p2(h)}:${p2(m)}:${p2(sc)},${String(ms).padStart(3,'0')}`};
  const toSrt=cues=>cues.map((c,i)=>`${i+1}\n${ts(c.st)} --> ${ts(c.en)}\n${String(c.text).replace(/\{\\[^}]*\}/g,'').replace(/<(?!\/?[ibu]>)[^>]*>/gi,'')}\n`).join('\n');
  const PLAT=CAP.getPlatform?CAP.getPlatform():'android';
  NAT.addListener('needSubs',async d=>{const o=S.vod;if(!o||o.key!==d.key||!S.settings.subAuto)return;
    const pref=S.settings.subLang||'ar';const force=S.settings.forceAr!==false&&pref==='ar';let all=[];
    try{if(o.subItem)all=await findSubs(o.subItem,o.subSeason,o.subEp)}catch(e){console.warn('subs',e)}
    for(const c of all.filter(c=>c.lang===pref).slice(0,5)){if(S.vod!==o)return;try{const txt=await fetchSubText(c,o.subSeason,o.subEp);const cues=parseSubs(txt);if(cues.length<3)continue;await NAT.addSubtitle({key:o.key,text:toSrt(cues),label:`${langName(c.lang)} · ${c.src}`,lang:'ar'});return}catch(e){console.warn('sub',e)}}
    if(!force||S.vod!==o)return;
    if(d.hasOther){try{await NAT.useMt({key:o.key,engine:S.settings.mtEngine||'auto'})}catch(e){}return}
    const cand=all.filter(c=>c.lang==='en').concat(all.filter(c=>c.lang!=='en'&&c.lang!=='ar'));
    for(const c of cand.slice(0,4)){if(S.vod!==o)return;try{const txt=await fetchSubText(c,o.subSeason,o.subEp);let cues=parseSubs(txt);if(cues.length<3)continue;
        if(PLAT==='android'&&(S.settings.mtEngine||'auto')!=='online'){await NAT.addSubtitle({key:o.key,text:toSrt(cues),label:'🤖 '+L('عربي (ترجمة آلية)','Arabic (machine)'),lang:c.lang,translate:true});return}
        const tr=await mtLines(cues.map(x=>String(x.text).replace(/<[^>]+>/g,'').replace(/\s*\n\s*/g,' ').trim()),c.lang);cues=cues.map((x,i)=>Object.assign({},x,{text:tr[i]||x.text}));
        await NAT.addSubtitle({key:o.key,text:toSrt(cues),label:'🤖 '+L('عربي (ترجمة آلية)','Arabic (machine)'),lang:'ar'});return}catch(e){console.warn('mt sub',e)}}});
  NAT.addListener('enhMode',d=>saveEnh(d.mode));
  // ---- downloads through Android DownloadManager ----
  startDownload=async function(it,ver,title,poster,epi){const url=ver.url;if(/\.m3u8(\?|$)/i.test(url)){toast(L('هذا العمل بث متقطع (HLS) وما ينفع تنزيله مباشرة','This title is an HLS stream and can\'t be downloaded directly'));return}
    const ext=((url.split('?')[0].match(/\.([a-z0-9]{2,4})$/i)||[])[1]||'mp4').toLowerCase();const id='d'+Date.now();const d={id,key:ver.key||it.key,title,poster:poster||'',url,got:0,total:0,state:'start',ts:Date.now(),ext};S.dls.push(d);saveDls();
    try{const r=await NAT.download({url,title,ext});d.nid=r.id;d.file=r.file;d.state='run';saveDls();toast(L('⬇ بدأ التنزيل: ','⬇ Download started: ')+title,2500);pollDl()}catch(e){d.state='err';d.err=String(e&&e.message||e);saveDls();toast(L('تعذّر التنزيل: ','Download failed: ')+d.err)}
    if(S.screen==='downloads')renderDownloads()};
  let pollT=null;async function pollDl(){clearTimeout(pollT);const act=S.dls.filter(d=>d.nid&&(d.state==='run'||d.state==='start'||d.state==='paused'));const all=S.dls.filter(d=>d.nid);if(!all.length)return;
    try{const r=await NAT.dlStatus({ids:all.map(d=>d.nid)});let ch=false;(r.list||[]).forEach(x=>{const d=S.dls.find(y=>y.nid===x.id);if(!d)return;const prev=d.state;
        if(x.status==='gone'){if(d.state!=='err'){d.state='err';d.err=L('انحذف الملف','File removed')}}else{d.got=x.got||0;if(x.total>0)d.total=x.total;d.uri=x.uri||d.uri;d.state=x.status==='done'?'done':x.status==='err'?'err':'run';if(x.status==='err')d.err=L('فشل الاتصال','Connection failed')+' ('+x.reason+')'}
        if(prev!==d.state){ch=true;if(d.state==='done')toast(L('✓ اكتمل التنزيل: ','✓ Download complete: ')+d.title,3000)}});
      saveDls();if(S.screen==='downloads'){if(ch)renderDownloads();else S.dls.forEach(d=>{const row=document.querySelector(`.dl[data-id="${d.id}"]`);if(row&&d.state==='run'){row.querySelector('.bar i').style.width=(d.total?d.got/d.total*100:0)+'%';row.querySelector('small').textContent=dlSub(d)}})}}catch(e){}
    if(act.length)pollT=setTimeout(pollDl,2000)}
  const origDlAction=dlAction;
  dlAction=async function(a,id){const d=S.dls.find(x=>x.id===id);
    if(a==='open'&&d){lastInput=Date.now();playVod({url:d.uri||d.url,title:d.title,key:'dl|'+d.id,local:true});return}
    if((a==='del'||a==='cancel')&&d){if(d.nid)try{await NAT.dlRemove({id:d.nid})}catch(e){}S.dls=S.dls.filter(x=>x!==d);saveDls();renderDownloads();return}
    if(a==='retry'&&d){S.dls=S.dls.filter(x=>x!==d);saveDls();await startDownload({key:d.key},{url:d.url,key:d.key},d.title,d.poster);return}
    if(a==='show'||a==='folder'){toast(L('الملفات في: Movies ← Sanad Player','Files are in Movies → Sanad Player'),3000);return}
    return origDlAction(a,id)};
  // ---- Android back button ----
  if(APP)APP.addListener('backButton',()=>{
    if($('#pinM').classList.contains('show')){$('#pinM').classList.remove('show');return}
    const mb=document.querySelector('.mbg.show');if(mb){mb.classList.remove('show');return}
    if(S.side){closeSide();return}
    if(S.pm){exitPM();return}
    if(S.stack&&S.stack.length){back();return}
    if(S.screen!=='tv'){go('tv');return}
    APP.minimizeApp()});
  setTimeout(pollDl,1500);
})()}

(async()=>{document.documentElement.lang=LANG;document.documentElement.dir=RTL()?'rtl':'ltr';
  await idb.open();await vmOpen();renderRail();bindStatic();if(isApp()){window.sanad.onDl(onDlProgress);S.dls.forEach(d=>{if(d.state==='run'||d.state==='start'){d.state='err';d.err=L('توقف عند إغلاق التطبيق — اضغط إعادة','Stopped when the app closed — press Retry')}});saveDls()}setInterval(tick,10000);setInterval(minuteTick,30000);setInterval(()=>{if(S.epgUrl)loadEPG(S.epgUrl)},6*3600e3);
  if(!(S.active&&S.playlists.some(p=>p.id===S.active))){S.active=S.playlists[0]?S.playlists[0].id:null;store.set('active',S.active)}
  if(S.active)loadActive();else render()})();
