name: Build Sanad Player APK
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Capacitor
        run: npm ci && npx cap sync android
      - name: Build APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease --stacktrace --no-daemon
      - name: Collect APK
        run: cp android/app/build/outputs/apk/release/app-release.apk SanadPlayer.apk && ls -la SanadPlayer.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SanadPlayer-apk
          path: SanadPlayer.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Sanad Player Android ${{ github.run_number }}
          files: SanadPlayer.apk
          make_latest: true
